[workspace]
authors = ["PyTorch Team <packages@pytorch.org>"]
channels = ["conda-forge"]
name = "pixi-pytorch-dev"
platforms = ["linux-64", "osx-arm64"]
version = "0.1.0"

[dependencies]
python = "3.10.*"
onnx-ir = "*"
python-build = ">=1.3.0,<2"

[tasks]
install = "spin install"

[target.linux-64.dependencies]
# These three don't have free-threading support
lldb = "*"
gdb = "*"
halide-python = "*"

[feature.spin.dependencies]
spin = ">=0.15,<0.16"

[feature.lintrunner.dependencies]
lintrunner = "*"
pip = "*"
python = ">=3.11"
spin = "*"

[feature.lintrunner.tasks]
lint = "spin lint"
quicklint = "spin quicklint"
quickfix = "spin quickfix"

[feature.regenerate.dependencies]
typing-extensions = ">=4.8.0"
jinja2 = "*"

[feature.regenerate.tasks]
regenerate = "spin regenerate-github-workflows"

[feature.core.dependencies]
pip = "*"
cpython = "*"
cmake = ">=3.27"
ninja = "*"
numpy = "*"
packaging = "*"
pkg-config = "*"
libuv = "*"
pyyaml = "*"
requests = "*"
six = "*"
typing-extensions = ">=4.10.0"
ccache = "*"
scikit-build = "*"
setuptools = ">=70.1.0,<80.0a0"
wheel = "*"
fsspec = "*"
types-dataclasses = "*"
expecttest = "*"
hypothesis = "*"
lintrunner = "*"
scipy = "*"
psutil = "*"
pytest = "*"
ghstack = "*"
ipython = "*"
pytest-sugar = "*"
pytest-xdist = "*"
filelock = "*"
sympy = "*"
astunparse = "*"
dill = "*"
jinja2 = "*"
lark = "*"
optree = "*"
tabulate = "*"
networkx = "*"
zlib = "*"
parameterized = "*"
libglib = "*"
pango = "*"
pillow = "*"

[feature.core.target.osx-arm64.dependencies]
compilers = "*"

[feature.core.target.linux-64.dependencies]
gcc = "14.*"
gxx = "14.*"
clang = "*"
clangxx = "*"
magma = "*"
cuda-driver-dev = "*"
cuda-version = "12.9.*"
cudnn = "*"
conda-gcc-specs = "*"
cuda-libraries-dev = "*"
cuda-nvcc = "*"
cuda-gdb = "*"
cuda-nvtx-dev = "*"
cuda-nvml-dev = "*"
cuda-cupti-dev = "*"
mkl = "*"
mkl-include = "*"
sysroot_linux-64 = ">=2.17"

[feature.core.pypi-dependencies]
z3-solver = "*"

[feature.freethreading.dependencies]
python = "3.13.*"
python-freethreading = "3.13.*"

[environments]
default = ["spin", "default", "core"]
freethreading = { features = [
    "freethreading",
    "core",
], no-default-feature = true }
lint = { features = ["spin", "lintrunner"], no-default-feature = true }
regenerate = { features = ["spin", "regenerate"], no-default-feature = true }
